<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sure AI</title>
<style>
body{margin:0;background:#070b22;color:white;font-family:Arial,sans-serif}
main{max-width:750px;margin:50px auto;padding:20px}
h1{text-align:center;color:#19dcff}
#messages{background:#101a3b;padding:20px;border-radius:15px;min-height:250px}
.msg{padding:12px;margin:10px 0;background:#26345c;border-radius:12px;white-space:pre-wrap}
.user{text-align:right;background:#284b82}
form{display:flex;gap:8px;margin-top:15px}
input{flex:1;min-width:0;padding:14px;border-radius:10px;border:0}
button{padding:12px 18px;background:#08bfe9;color:#071027;border:0;border-radius:10px;font-weight:bold}
#status{text-align:center;color:#19dcff}
</style>
</head>
<body>
<main>
<h1>Sure AI</h1>
<p style="text-align:center">Your Personal AI Assistant</p>
<p id="status">AI Assistant Ready</p>
<div id="messages">
<div class="msg">নমস্কার! আমি Sure AI। কী জানতে চাও?</div>
</div>
<form id="chatForm">
<input id="prompt" placeholder="এখানে প্রশ্ন লেখো..." required>
<button id="send">পাঠান</button>
</form>
</main>
<script>
const form=document.getElementById("chatForm");
const input=document.getElementById("prompt");
const messages=document.getElementById("messages");
const button=document.getElementById("send");
const statusText=document.getElementById("status");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 messages.appendChild(div);
}

form.addEventListener("submit",async function(e){
 e.preventDefault();
 const message=input.value.trim();
 if(!message)return;

 addMessage(message,"user");
 input.value="";
 button.disabled=true;
 statusText.textContent="Sure AI ভাবছে...";

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"API Error");
  addMessage(data.reply||"উত্তর পাওয়া যায়নি","ai");
  statusText.textContent="AI Assistant Ready";
 }catch(error){
  addMessage("সমস্যা হয়েছে: "+error.message,"ai");
  statusText.textContent="Connection Error";
 }
 button.disabled=false;
});
</script>
</body>
</html>
